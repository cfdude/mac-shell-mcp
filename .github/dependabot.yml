version: 2
updates:
  # Grouped so a batch of advisories arrives as one PR rather than one per alert.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 breaks @typescript-eslint/parser, whose peer range is
      # >=4.8.4 <6.1.0. Dependabot proposed it, CI caught it. Revisit when
      # typescript-eslint widens the range.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
