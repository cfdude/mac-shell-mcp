name: Security Scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am

# Cancel superseded in-flight runs: at 90% of the monthly Actions allowance,
# a run for a commit that has already been replaced is pure waste.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    uses: cfdude/.github/.github/workflows/security-trivy.yml@b5f9e50d643459b3d89c0cd5fdb53119ed4f4746  # main
    permissions:
      contents: read
      security-events: write

  semgrep:
    uses: cfdude/.github/.github/workflows/security-semgrep.yml@b5f9e50d643459b3d89c0cd5fdb53119ed4f4746  # main
    permissions:
      contents: read
      security-events: write
