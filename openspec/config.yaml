schema: spec-driven

context: |
  mac-shell-mcp — an MCP server exposing macOS shell execution to AI clients
  (primarily Claude Desktop; also Claude Code, Docker/Smithery, custom hosts).

  Tech stack: TypeScript (ESM, strict), Node >=18, @modelcontextprotocol/sdk,
  zod, Jest. Conventional commits. TypeScript is LEGACY here — this repo stays
  TypeScript; do not propose converting it, and do not propose it for new work.

  Current work: the 2.0 security redesign. The approved design spec is
  docs/superpowers/specs/2026-08-13-mac-shell-mcp-2.0-security-redesign.md and it
  is authoritative — read it before generating artifacts.

  Non-negotiable invariants from that spec (revised 2026-08-28 after two
  adversarial review rounds returned 32 blocks and four live exploits):
  - NO shell. execFile is called without the `shell` option, ever. Passing
    `shell` re-introduces the verified CWE-78 command injection.
  - The agent cannot widen its own authority. No MCP tool mutates policy —
    such tools are absent, not merely gated.
  - ALLOWLISTS, NEVER DENYLISTS. Every command carries a bounded allowlist of
    argument shapes. A denylist is a list of what someone thought of; it was
    tried and defeated by `git -c alias`, `git --git-dir`, and `awk system()`.
  - A command belongs in the default set only if a bounded grammar can be stated
    under which it cannot name another program or script, CANNOT WRITE OR CREATE
    any path, and cannot reach a path the system did not scope-check. The
    declared effect is a LABEL, NOT A GUARANTEE -- `find` is declared read and
    `-fprintf` writes attacker-chosen content anywhere. Protection therefore
    keys on the OPERATION a request performs, never on the label.
  - The default set is exactly: ls pwd echo cat head tail wc grep. NOT rg --
    it lives outside /usr/bin and admitting /opt/homebrew/bin would make a
    user-writable directory a program source. Program directories must not be
    writable by the user the server runs as.
    `find`, `git`, `rm` and every interpreter are ABSENT -- addable only by
    explicit human configuration. git executes commands from local .git/config
    and no env var disables it.
  - The child environment is CONSTRUCTED from an allowlist, never inherited --
    RIPGREP_CONFIG_PATH proved an argv-only allowlist cannot see it.
  - Authorization authorizes the PROGRAM as well as the arguments: resolve to an
    absolute path (case-corrected, symlinks followed) BEFORE the policy match,
    match by resolved path not basename, and refuse any program resolving inside
    a root. Roots hold data, never code.
  - Confined tools use effect x scope; `execute_external_command` is the only
    route outside the roots.
  - The config file is canonical; the MCPB manifest is one delivery mechanism.
  - Protection is keyed on filesystem identity (st_dev, st_ino) captured at
    startup AND by path, covering every discovery location and its ancestors,
    every program directory, and the whole audit log directory. Non-overridable
    from config itself.
  - Fail closed. Ambiguity denies, and every denial names what IS allowed.
  - `ask` requires the MCP `elicitation` capability specifically — NOT `sampling`,
    which routes the question to a model rather than a human. Otherwise `ask`
    degrades to `deny`, never to `allow`.
  - NO DELETE in 2.0. `rm` is FORBIDDEN in 1.x, so this is zero regression. The
    deferred spec is openspec/deferred/delete-safety-2.1.md; it needs MCP
    elicitation before it is safe.

  Testing: Jest runs against compiled output in build/ (jest.config.js sets
  transform: {} and matches tests/**/*.test.js), so `npm run build` gates tests.
  ts-jest is NOT a dependency. TypeScript is pinned to 6.0.3 — NOT 7.x, which
  @typescript-eslint/parser (peer >=4.8.4 <6.1.0) refuses.

  Completion bar: every test, lint and format check green across the whole tree.
  Never `git commit --no-verify`.
